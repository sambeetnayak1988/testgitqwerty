<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample Static Website - Contact</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="container">
      <h1 class="brand">SampleSite</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="terms-and-conditions.html">Terms</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>Contact Us</h2>
      <p>Have questions? Send us a message using this sample form.</p>
      <form>
        <div>
          <label for="name">Name</label>
          <input id="name" type="text" placeholder="Your name" />
        </div>
        <div>
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" />
        </div>
        <div>
          <label for="message">Message</label>
          <textarea id="message" rows="5" placeholder="Write your message..."></textarea>
        </div>
        <button class="btn" type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer class="container">
    <p>&copy; 2026 SampleSite. All rights reserved.</p>
  </footer>
</body>
</html>
